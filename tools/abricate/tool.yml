id: abricate
name: ABRicate
version: 1.4.0
category: AMR and virulence
description: >-
  Screens the assembly against a gene database (resistance, virulence,
  plasmids ...). Pick the database in the settings; the same tool can be used
  in several steps with different databases.
homepage: https://github.com/tseemann/abricate
license: GPL-2.0
citation: "Seemann T. ABRicate. https://github.com/tseemann/abricate"
container: quay.io/biocontainers/abricate:1.4.0--h05cac1d_0
scope: per_sample
resources: {cpus: 2, memory_gb: 2}
requirements: {memory_gb: 1}

inputs:
  contigs: {type: fasta, description: Assembled contigs.}

outputs:
  report: {type: tsv, path: "out/{sample}.abricate.tsv", description: Genes found (one line per hit).}

settings:
  db:
    label: Database
    type: select
    options: [ncbi, card, resfinder, argannot, megares, vfdb, victors, ecoli_vf, upec_expec_vf, ecoh, plasmidfinder, bacmet2]
    default: ncbi
    description: "ncbi = NCBI AMRFinder genes (resistance); vfdb = virulence factors; plasmidfinder = plasmid replicons."
  minid:
    label: Minimum identity (%)
    type: number
    default: 80.0
    description: Minimum DNA % identity of a hit.
  mincov:
    label: Minimum coverage (%)
    type: number
    default: 80.0
    description: Minimum % of the gene a hit must cover.
  noheader:
    label: No header line
    type: boolean
    default: false
    description: Leave out the column-name line (used when tables are joined together).

versions:
  abricate: abricate --version 2>&1 | sed 's/^abricate //'
  abricate_db_dates: abricate --list 2>/dev/null | awk 'NR>1{printf "%s%s=%s", s, $1, $4; s=", "} END{print ""}'

command: |
  cp -L "$IN_contigs" "$SAMPLE.fasta"
  args=()
  [ "$S_noheader" = true ] && args+=(--noheader)
  abricate --threads "$CPUS" --db "$S_db" --minid "$S_minid" --mincov "$S_mincov" "${args[@]}" \
      "$SAMPLE.fasta" > "out/$SAMPLE.abricate.tsv"
