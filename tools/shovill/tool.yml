id: shovill
name: Shovill
version: 1.4.2
category: Assembly
description: >-
  Assembles each genome from its reads (SPAdes underneath), with read
  sub-sampling and clean-up to make it faster. Gives the contigs used by
  every typing step.
homepage: https://github.com/tseemann/shovill
license: GPL-3.0
citation: "Seemann T. Shovill: faster SPAdes assembly of Illumina reads. https://github.com/tseemann/shovill"
container: quay.io/biocontainers/shovill:1.4.2--hdfd78af_1
scope: per_sample
resources: {cpus: 12, memory_gb: 12, memory_setting: ram, low_memory_setting: low_memory, low_memory_gb: 8}
requirements:
  memory_gb: 8
  recommended_memory_gb: 16
  disk_gb_per_sample: 5
  note: >-
    SPAdes needs more memory for large genomes or very deep data. On a smaller
    computer, lower Memory or turn on Low-memory mode in Shovill's settings.

inputs:
  reads: {type: reads, description: Paired reads (trimmed by fastp, or raw if fastp is off).}

outputs:
  contigs: {type: fasta, path: "out/{sample}.contigs.fa", description: Assembled contigs.}
  log: {type: log, path: "out/{sample}.shovill.log", description: Shovill log (includes the estimated sequencing depth).}

settings:
  assembler:
    label: Assembler
    type: select
    options: [spades, skesa, megahit, velvet]
    default: spades
    description: Which assembler shovill runs.
  depth:
    label: Sub-sample depth
    type: integer
    default: 100
    description: >-
      Reads are randomly sub-sampled down to this depth before assembly (faster,
      same result for most genomes). 0 = use all reads.
  ram:
    label: Memory (GB)
    type: integer
    default: 0
    auto: {value: 0, label: "12 GB, less on small computers"}
    description: >-
      Most memory the assembly may use. Auto = 12 GB (8 GB in Low-memory mode),
      but never more than this computer's RAM minus 2 GB (at least 4 GB). If
      SPAdes needs more than this it stops with an error. The amount used is
      saved in the run's provenance.
  low_memory:
    label: Low-memory mode
    type: boolean
    default: false
    description: >-
      For computers with less than 16 GB RAM. Auto memory drops to 8 GB, reads
      are sub-sampled to at most 100x depth and SPAdes uses at most 8 threads.
      Uses clearly less memory; the lower depth can change the assembly slightly
      compared with Galaxy (150x). Saved in the run's provenance.
  gsize:
    label: Genome size
    type: string
    default: ""
    auto: {value: "", label: Auto-detect from reads}
    description: Estimated genome size, e.g. 5.1M. Auto works it out from the reads.
  minlen:
    label: Minimum contig length
    type: integer
    default: 0
    description: Contigs shorter than this (bp) are dropped. 0 = shovill's own default.
  mincov:
    label: Minimum contig coverage
    type: number
    default: 2
    description: Contigs with lower read coverage than this are dropped.
  namefmt:
    label: Contig name format
    type: string
    default: contig%05d
    description: How contigs are named (printf style).
  trim:
    label: Trim adaptors (Trimmomatic)
    type: boolean
    default: false
    description: Extra adaptor trimming inside shovill. Off when fastp already trims.
  nocorr:
    label: Skip post-assembly correction
    type: boolean
    default: false
    description: Skip the Pilon polishing step after assembly (faster).
  kmers:
    label: K-mer sizes
    type: string
    default: ""
    auto: {value: "", label: Automatic}
    description: Comma-separated SPAdes k-mer sizes. Automatic picks them from read length.
  opts:
    label: Extra SPAdes options
    type: string
    default: ""
    description: Passed straight to the assembler (advanced).

versions:
  shovill: shovill --version 2>&1 | sed 's/^shovill //'
  spades: spades.py --version 2>&1 | sed 's/^SPAdes genome assembler v//; s/^SPAdes v//'

command: |
  args=()
  [ -n "$S_gsize" ] && args+=(--gsize "$S_gsize")
  [ -n "$S_kmers" ] && args+=(--kmers "$S_kmers")
  [ -n "$S_opts" ] && args+=(--opts "$S_opts")
  [ "$S_trim" = true ] && args+=(--trim)
  [ "$S_nocorr" = true ] && args+=(--nocorr)
  threads="$CPUS"; depth="$S_depth"
  if [ "$S_low_memory" = true ]; then
      [ "$threads" -gt 8 ] && threads=8
      if [ "$depth" -eq 0 ] || [ "$depth" -gt 100 ]; then depth=100; fi
      echo "low_memory: on (depth ${depth}x, $threads threads)" >> .ntg_notes
  fi
  case "$S_ram" in
      ''|0) echo "memory: $MEM_GB GB (auto)" >> .ntg_notes ;;
      *) echo "memory: $MEM_GB GB (set by user)" >> .ntg_notes ;;
  esac
  shovill \
      --outdir shovill_out \
      --cpus "$threads" \
      --ram "$MEM_GB" \
      --R1 "$IN_reads_1" --R2 "$IN_reads_2" \
      --namefmt "$S_namefmt" \
      --depth "$depth" \
      --minlen "$S_minlen" \
      --mincov "$S_mincov" \
      --assembler "$S_assembler" \
      "${args[@]}"
  mv shovill_out/contigs.fa "out/$SAMPLE.contigs.fa"
  mv shovill_out/shovill.log "out/$SAMPLE.shovill.log"
